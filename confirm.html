<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#285A73" />
  <title>Confirmar atendimento</title>
  <style>
:root{
  --green:#285A73; --green-2:#3E708A; --cream:#F5F8FA; --paper:#FFFFFF;
  --marsala:#5B86A3; --gold:#A9C9DB; --ink:#20303A; --muted:#6F7F8A;
  --line:#DDE6EC; --ok:#3B7CA3; --warn:#a06d16; --danger:#a94343;
  --shadow:0 12px 34px rgba(32,37,34,.09); --radius:22px;
}
*{box-sizing:border-box} html{background:var(--cream)} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--cream);min-height:100vh}
button,input,select,textarea{font:inherit} button{cursor:pointer} .hidden{display:none!important}
.eyebrow{font-size:.72rem;letter-spacing:.14em;font-weight:800;color:var(--marsala);margin:0 0 4px;text-transform:uppercase}.muted{color:var(--muted)}.tiny{font-size:.76rem;line-height:1.45}
.login-screen{min-height:100vh;display:grid;place-items:center;padding:28px 18px}.login-card{width:min(460px,100%);background:var(--paper);border:1px solid var(--line);border-radius:30px;padding:28px;box-shadow:var(--shadow)}
.brand-lockup{display:flex;gap:14px;align-items:center}.brand-icon{width:62px;height:62px}.brand-lockup h1{margin:0;font-size:1.8rem}.login-copy{color:var(--muted);line-height:1.55;margin:18px 0 22px}
.form-stack{display:grid;gap:14px} label{display:grid;gap:7px;font-size:.88rem;font-weight:700;color:#3c433f} input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;color:var(--ink);outline:none} input:focus,select:focus,textarea:focus{border-color:var(--green-2);box-shadow:0 0 0 3px rgba(40,91,76,.10)} textarea{resize:vertical}
.btn{border:0;border-radius:15px;padding:13px 16px;font-weight:800;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:active{transform:scale(.985)}.btn.primary{background:var(--green);color:white}.btn.secondary{background:#EEF5F9;color:var(--green)}.btn.danger-ghost{background:#fff0f0;color:var(--danger);border:1px solid #f0cece}.btn.soft{background:#f4eee2;color:#644f29}.btn.wide,.wide{width:100%}
.divider{display:flex;align-items:center;gap:12px;color:#a39d93;font-size:.78rem;margin:17px 0}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}.setup-notice{background:#fff8e8;border:1px solid #ead7a5;color:#6b572c;padding:10px 12px;border-radius:12px;font-size:.82rem;line-height:1.45}
.app-shell{min-height:100vh;padding-bottom:96px}.topbar{position:sticky;top:0;z-index:10;background:rgba(245,241,233,.93);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid rgba(230,223,211,.8)}.brand-mini{display:flex;align-items:center;gap:10px}.brand-mini img{width:40px;height:40px}.brand-mini strong{display:block}.brand-mini span{display:block;color:var(--muted);font-size:.76rem;margin-top:2px}.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-weight:800;color:var(--green)}
.main-content{width:min(860px,100%);margin:0 auto;padding:20px 16px}.page-title-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:5px 0 18px}.page-title-row h1{margin:0;font-size:1.7rem}.page-title-row p{margin:5px 0 0;color:var(--muted);font-size:.9rem}.inline-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.compact-input{max-width:170px;padding:9px 10px;border-radius:12px}
.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}.metric{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 5px 18px rgba(32,37,34,.04)}.metric span{font-size:.76rem;color:var(--muted);display:block}.metric strong{display:block;font-size:1.4rem;margin-top:5px}.metric.highlight{background:var(--green);color:white;border-color:var(--green)}.metric.highlight span{color:#E3EEF4}
.section-label{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}.section-label h2{margin:0;font-size:1rem}.section-label span{font-size:.76rem;color:var(--muted)}
.session-list{display:grid;gap:10px}.session-card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 4px 14px rgba(32,37,34,.035)}.session-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.time-block strong{font-size:1.2rem;color:var(--green)}.time-block span{display:block;font-size:.76rem;color:var(--muted);margin-top:3px}.patient-block{flex:1}.patient-block strong{display:block;font-size:1rem}.patient-block small{display:block;color:var(--muted);margin-top:3px}.status-pill{border-radius:999px;padding:6px 9px;font-size:.68rem;font-weight:800;white-space:nowrap}.s-pending{background:#fff4d9;color:#7b5c1d}.s-confirmed{background:#e6f5eb;color:#2C6684}.s-in_progress{background:#e4eef8;color:#315f88}.s-completed{background:#EEF3F6;color:#526B79}.s-cancelled,.s-no_show{background:#f9e7e7;color:#8d3d3d}.s-reschedule_requested{background:#f3e8f4;color:#76427c}
.session-meta{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;color:var(--muted);font-size:.78rem}.mini-tag{background:#f6f2eb;border-radius:999px;padding:6px 9px}.session-actions{display:flex;gap:7px;flex-wrap:wrap}.action-btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 11px;font-size:.76rem;font-weight:800;color:var(--green)}.action-btn.strong{background:var(--green);color:white;border-color:var(--green)}.action-btn.finish{background:var(--marsala);color:white;border-color:var(--marsala)}.action-btn.whatsapp{background:#EAF5FA;color:#2C6C8A;border-color:#CFE4EF}.action-btn.paid{background:#edf7ef;color:#1d6b3b}
.empty-state{text-align:center;padding:38px 18px;background:var(--paper);border:1px dashed #cfc8bd;border-radius:22px;color:var(--muted)}.empty-state .big{font-size:2rem;margin-bottom:6px}.empty-state strong{color:var(--ink);display:block;margin-bottom:5px}
.date-group{margin:18px 0}.date-heading{font-size:.82rem;font-weight:900;color:var(--green);margin:0 0 8px;padding-left:4px;text-transform:capitalize}
.patient-grid{display:grid;gap:11px}.patient-card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:15px}.patient-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.avatar{width:42px;height:42px;border-radius:14px;background:#EAF2F7;color:var(--green);display:grid;place-items:center;font-weight:900}.patient-main{display:flex;gap:10px;align-items:center;flex:1}.patient-main strong{display:block}.patient-main small{display:block;color:var(--muted);margin-top:3px}.patient-card-actions{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.finance-table{display:grid;gap:8px}.finance-row{display:grid;grid-template-columns:1fr auto;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px}.finance-row strong{display:block}.finance-row small{color:var(--muted)}.finance-money{text-align:right}.finance-money span{display:block;font-weight:900}.finance-money button{margin-top:5px;border:0;background:none;color:var(--green);font-size:.75rem;font-weight:800}
.bottom-nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:20;width:min(520px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,253,249,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:24px;padding:7px;box-shadow:0 12px 30px rgba(32,37,34,.13)}.nav-item{border:0;background:transparent;border-radius:17px;padding:8px 4px;color:#78807b;display:grid;place-items:center;gap:2px;font-weight:800}.nav-item span{font-size:1.05rem}.nav-item small{font-size:.67rem}.nav-item.active{background:var(--green);color:white}.fab{position:fixed;right:20px;bottom:98px;z-index:15;width:56px;height:56px;border-radius:50%;border:0;background:var(--marsala);color:white;font-size:1.7rem;box-shadow:0 10px 22px rgba(155,75,86,.25)}
.modal{border:0;padding:0;background:transparent;width:min(520px,calc(100% - 24px));max-height:88vh}.modal::backdrop{background:rgba(17,26,22,.48);backdrop-filter:blur(3px)}.modal-card{background:var(--paper);border-radius:26px;padding:20px;display:grid;gap:14px;max-height:88vh;overflow:auto}.modal-header{display:flex;justify-content:space-between;align-items:flex-start}.modal-header h2{margin:0}.close-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:white;font-size:1.3rem}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}fieldset{border:1px solid var(--line);border-radius:16px;padding:12px}legend{padding:0 6px;font-size:.83rem;font-weight:800}.weekday-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.weekday-grid label{display:flex;align-items:center;gap:6px;background:#f5f3ed;border-radius:10px;padding:8px}.weekday-grid input{width:auto}.patient-highlight{margin:0;background:#EEF5F9;padding:10px 12px;border-radius:12px;color:var(--green);font-weight:800}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-130%);z-index:100;background:#20303A;color:white;border-radius:999px;padding:10px 15px;font-size:.82rem;font-weight:700;box-shadow:var(--shadow);transition:.2s}.toast.show{transform:translate(-50%,0)}
.public-body{background:linear-gradient(180deg,#285A73 0 31%,#F5F8FA 31% 100%)}.confirm-wrap{min-height:100vh;display:grid;place-items:center;padding:28px 16px}.confirm-card{width:min(480px,100%);background:var(--paper);border-radius:30px;padding:27px;box-shadow:0 18px 50px rgba(15,30,24,.18)}.confirm-logo{width:58px;height:58px;margin-bottom:12px}.confirm-card h1{margin:0 0 16px}.confirm-greeting{font-size:1.03rem;line-height:1.5}.appointment-public-details{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.appointment-public-details div{background:#f4f1ea;border-radius:14px;padding:12px;text-align:center}.appointment-public-details span{display:block;font-size:.7rem;color:var(--muted)}.appointment-public-details strong{display:block;margin-top:5px;font-size:.9rem}.status-line{padding:10px 12px;border-radius:12px;background:#f7f1e3;font-size:.82rem}.public-actions{display:grid;gap:9px;margin-top:15px}.privacy-note{font-size:.72rem;color:var(--muted);line-height:1.45;margin-top:18px}.success-panel{background:#eaf6ee;color:#275f3e;padding:14px;border-radius:15px;line-height:1.45;font-weight:700}.error-panel{background:#fae9e9;color:#7f3838;padding:14px;border-radius:15px}.loading-block{padding:24px 0;color:var(--muted)}
@media(min-width:700px){.summary-grid{grid-template-columns:repeat(4,1fr)}.patient-grid{grid-template-columns:repeat(2,1fr)}.fab{right:max(24px,calc((100vw - 860px)/2 + 24px))}}
@media(max-width:420px){.two-col{grid-template-columns:1fr}.appointment-public-details{grid-template-columns:1fr}.session-head{align-items:flex-start}.status-pill{font-size:.62rem}.page-title-row{align-items:flex-start;flex-direction:column}.inline-actions{width:100%}.compact-input{max-width:none;flex:1}}

</style>
</head>

/*
  CONFIGURAÇÃO DO SUPABASE
  1) Crie um projeto em https://supabase.com

  4) Cole abaixo e publique novamente no GitHub Pages.

  A Publishable key pode ficar no front-end. A segurança real é feita pelas políticas RLS
  e pelas funções públicas limitadas do arquivo supabase.sql.
*/
window.APP_CONFIG = {
  SUPABASE_URL: "https://fjumiqrfilcgvjdpuupj.supabase.co",
  SUPABASE_PUBLISHABLE_KEY: "sb_publishable_dSALwP3rs4lAg9ACeYPHIQ_-VRRU96-",
  CLINIC_NAME: "KINEVO"
};

</script>
  <script>
(() => {
  'use strict';
  const cfg=window.APP_CONFIG||{}; const configured=Boolean(cfg.SUPABASE_URL&&cfg.SUPABASE_PUBLISHABLE_KEY);
  const db=configured?window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY):null;
  const $=id=>document.getElementById(id); let token='', appointment=null;
  document.addEventListener('DOMContentLoaded',init);
  async function init(){
    token=new URLSearchParams(location.search).get('t')||'';
    document.querySelectorAll('[data-response]').forEach(b=>b.addEventListener('click',()=>respond(b.dataset.response)));
    if(!token)return showError('Link de confirmação inválido.');
    if(token.startsWith('demo-'))return loadDemo();
    if(!configured)return showError('Este aplicativo ainda não foi conectado ao servidor.');
    const {data,error}=await db.rpc('get_public_appointment',{p_token:token});
    const row=Array.isArray(data)?data[0]:data; if(error||!row)return showError('Este agendamento não foi encontrado ou o link expirou.');
    appointment=row; render();
  }
  function loadDemo(){
    const data=JSON.parse(localStorage.getItem('fisioDemoData')||'{}'); const a=(data.appointments||[]).find(x=>x.confirmation_token===token); if(!a)return showError('Este link de demonstração só funciona no aparelho onde os dados foram criados.');
    const p=(data.patients||[]).find(x=>x.id===a.patient_id); appointment={patient_first_name:(p?.name||'Paciente').split(' ')[0],scheduled_start:a.scheduled_start,duration_minutes:a.duration_minutes,status:a.status}; render();
  }
  function render(){
    const d=new Date(appointment.scheduled_start); $('confirmLoading').classList.add('hidden'); $('confirmContent').classList.remove('hidden');
    $('confirmGreeting').textContent=`Olá, ${appointment.patient_first_name || 'tudo bem'}! Confira os dados antes de responder:`;
    $('confirmDate').textContent=new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'long'}).format(d); $('confirmTime').textContent=new Intl.DateTimeFormat('pt-BR',{hour:'2-digit',minute:'2-digit'}).format(d); $('confirmDuration').textContent=`${appointment.duration_minutes||60} min`;
    $('confirmStatus').textContent=statusText(appointment.status);
    if(['cancelled','completed','no_show'].includes(appointment.status)) $('confirmActions').classList.add('hidden');
  }
  async function respond(response){
    document.querySelectorAll('[data-response]').forEach(b=>b.disabled=true);
    if(token.startsWith('demo-')){
      const data=JSON.parse(localStorage.getItem('fisioDemoData')||'{}'); const a=(data.appointments||[]).find(x=>x.confirmation_token===token); if(a){a.status=response;localStorage.setItem('fisioDemoData',JSON.stringify(data));}
    } else {
      const {data,error}=await db.rpc('respond_public_appointment',{p_token:token,p_response:response}); if(error||data!==true){document.querySelectorAll('[data-response]').forEach(b=>b.disabled=false);return showError('Não foi possível registrar sua resposta. Tente novamente.');}
    }
    appointment.status=response; $('confirmActions').classList.add('hidden'); $('confirmStatus').textContent=statusText(response); $('confirmSuccess').classList.remove('hidden'); $('confirmSuccess').textContent=response==='confirmed'?'Presença confirmada. Obrigado! ✅':response==='reschedule_requested'?'Recebemos seu pedido para remarcar. Entre em contato pelo WhatsApp para combinar um novo horário.':'Atendimento cancelado. Sua resposta já foi registrada.';
  }
  function statusText(s){return ({pending:'Aguardando sua confirmação.',confirmed:'✓ Presença confirmada.',reschedule_requested:'↻ Pedido de remarcação registrado.',cancelled:'Atendimento cancelado.',in_progress:'Atendimento em andamento.',completed:'Atendimento já realizado.',no_show:'Atendimento encerrado como falta.',not_realized:'Atendimento não realizado.',patient_unavailable:'Paciente indisponível.'}[s]||'Status atualizado.');}
  function showError(msg){$('confirmLoading').classList.add('hidden');$('confirmError').textContent=msg;$('confirmError').classList.remove('hidden');}
})();

</script>
