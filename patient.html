<style>
:root{--green:#173f35;--cream:#f5f1e9;--paper:#fffdf9;--marsala:#9b4b56;--ink:#202522;--muted:#6f7772;--line:#e6dfd3;--danger:#a94343;--shadow:0 14px 40px rgba(24,45,36,.12)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#173f35 0 220px,#f5f1e9 220px);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);min-height:100vh}button,a{font:inherit}.wrap{width:min(680px,100%);margin:0 auto;padding:28px 16px 42px}.hero{color:white;margin-bottom:20px}.logo{width:58px;height:58px}.hero p{margin:12px 0 4px;font-size:.74rem;font-weight:900;letter-spacing:.14em}.hero h1{margin:0;font-size:2rem}.hero .sub{color:#dce7e1;margin-top:6px}.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.section-title h2{margin:0;font-size:1.08rem}.section-title span{font-size:.76rem;color:var(--muted)}.appt{border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0}.appt strong{display:block}.appt small{color:var(--muted);display:block;margin-top:4px}.btn{border:0;border-radius:13px;padding:11px 13px;font-weight:850;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}.btn.primary{background:var(--green);color:white}.btn.secondary{background:#edf3ef;color:var(--green)}.btn.danger{background:#fff0f0;color:var(--danger);border:1px solid #eccaca}.btn.full{width:100%}.exercise{border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}.exercise h3{margin:0;font-size:1rem}.exercise .cat{color:var(--muted);font-size:.73rem;margin-top:3px}.dose{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.pill{background:#f4f1ea;border-radius:999px;padding:6px 9px;font-size:.73rem}.instructions{font-size:.82rem;line-height:1.45;background:#f8f5ef;padding:10px;border-radius:12px;margin:9px 0}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.actions .btn{font-size:.72rem;padding:10px 6px}.today-status{margin-top:9px;padding:8px 10px;border-radius:11px;background:#edf3ef;color:var(--green);font-size:.77rem;font-weight:800}.adherence{display:flex;gap:4px;margin-top:9px;flex-wrap:wrap}.day{width:30px;height:30px;border-radius:8px;background:#eeece6;display:grid;place-items:center;font-size:.63rem;font-weight:850}.day.done{background:#ddf0e3;color:#2e6847}.day.pain{background:#fde9d8;color:#914f1f}.day.unable{background:#f6dede;color:#893b3b}.empty{color:var(--muted);font-size:.85rem;padding:8px 0}.notice{background:#fff8e8;border:1px solid #ead7a5;color:#6b572c;border-radius:13px;padding:11px;font-size:.78rem;line-height:1.45}.hidden{display:none!important}.modal{border:0;padding:0;background:transparent;width:min(440px,calc(100% - 22px))}.modal::backdrop{background:rgba(10,20,16,.52)}.modal-card{background:var(--paper);border-radius:22px;padding:18px;display:grid;gap:12px}.modal-card h2{margin:0}.modal-card label{display:grid;gap:6px;font-size:.83rem;font-weight:750}.modal-card select,.modal-card textarea{border:1px solid var(--line);border-radius:12px;padding:11px;background:white}.close{float:right;border:0;background:white;font-size:1.3rem}.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-140%);background:#202522;color:white;padding:10px 14px;border-radius:999px;font-size:.8rem;font-weight:800;transition:.2s;z-index:50}.toast.show{transform:translate(-50%,0)}@media(max-width:430px){.actions{grid-template-columns:1fr}.hero h1{font-size:1.7rem}}
</style>
</head>

<script>
(()=>{'use strict';const $=id=>document.getElementById(id),cfg=window.APP_CONFIG,db=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY);let token='',portal=null;document.addEventListener('DOMContentLoaded',init);async function init(){for(let i=0;i<=10;i++)$('painScore').insertAdjacentHTML('beforeend',`<option>${i}</option>`);$('painClose').onclick=()=>$('painDialog').close();$('painSave').onclick=savePain;token=new URLSearchParams(location.search).get('p')||'';if(!token)return fail('Link da Área do Paciente inválido.');await load()}async function load(){const{data,error}=await db.rpc('get_patient_portal',{p_token:token});if(error||!data)return fail('Não foi possível abrir sua área. Peça ao profissional um novo link.');portal=data;$('loading').classList.add('hidden');$('content').classList.remove('hidden');$('hello').textContent=`Olá, ${portal.patient_first_name||'tudo bem'}!`;renderAppointments();renderExercises()}function renderAppointments(){const arr=portal.appointments||[];$('apptCount').textContent=`${arr.length} próximo(s)`;$('appointments').innerHTML=arr.length?arr.map(a=>{const d=new Date(a.scheduled_start),u=new URL('confirm.html',location.href);u.searchParams.set('t',a.confirmation_token);return `<div class="appt"><strong>${fmtLong(d)} • ${fmtTime(d)}</strong><small>${esc(a.appointment_type||'Atendimento')} • ${a.duration_minutes||60} min • ${status(a.status)}</small>${['pending','confirmed','reschedule_requested'].includes(a.status)?`<a class="btn secondary" style="margin-top:9px" href="${u}">Confirmar / remarcar</a>`:''}</div>`}).join(''):'<div class="empty">Nenhum atendimento futuro disponível.</div>'}function renderExercises(){const arr=portal.exercises||[];$('exerciseCount').textContent=`${arr.length} ativo(s)`;$('exercises').innerHTML=arr.length?arr.map(ex=>{const checks=ex.checkins||[],today=dateKey(new Date()),tod=checks.find(c=>c.checkin_date===today);return `<article class="exercise"><h3>${esc(ex.exercise_name)}</h3><div class="cat">${esc(ex.category||'Exercício')}</div><div class="dose">${ex.sets?`<span class="pill">${esc(ex.sets)} séries</span>`:''}${ex.reps?`<span class="pill">${esc(ex.reps)} repetições</span>`:''}${ex.frequency?`<span class="pill">${esc(ex.frequency)}</span>`:''}</div>${ex.instructions?`<div class="instructions">${esc(ex.instructions)}</div>`:''}<a class="btn secondary full" href="${esc(ex.video_url||'#')}" target="_blank" rel="noopener">▶ Ver demonstração no YouTube</a><div class="actions"><button class="btn primary" data-checkin="done" data-id="${ex.id}">✓ Fiz hoje</button><button class="btn secondary" data-checkin="unable" data-id="${ex.id}">Não consegui</button><button class="btn danger" data-checkin="pain" data-id="${ex.id}">Senti dor</button></div>${tod?`<div class="today-status">Hoje: ${statusCheck(tod.status)}${tod.pain_score!=null?` • dor ${tod.pain_score}/10`:''}</div>`:''}<div class="adherence">${last7().map(d=>{const k=dateKey(d),c=checks.find(x=>x.checkin_date===k);return `<div class="day ${c?.status||''}" title="${k}">${c?({done:'✓',pain:'!',unable:'×'}[c.status]||'•'):d.toLocaleDateString('pt-BR',{weekday:'narrow'})}</div>`}).join('')}</div></article>`}).join(''):'<div class="empty">Seu profissional ainda não adicionou exercícios para casa.</div>';$('exercises').querySelectorAll('[data-checkin]').forEach(b=>b.onclick=()=>{if(b.dataset.checkin==='pain')openPain(b.dataset.id);else sendCheckin(b.dataset.id,b.dataset.checkin,null,'')})}function openPain(id){$('painPrescriptionId').value=id;$('painScore').value='';$('painNotes').value='';$('painDialog').showModal()}async function savePain(){await sendCheckin($('painPrescriptionId').value,'pain',$('painScore').value===''?null:Number($('painScore').value),$('painNotes').value.trim());$('painDialog').close()}async function sendCheckin(id,statusValue,pain,notes){const{data,error}=await db.rpc('patient_exercise_checkin',{p_token:token,p_prescription_id:id,p_checkin_date:dateKey(new Date()),p_status:statusValue,p_pain_score:pain,p_notes:notes||null});if(error||data!==true)return toast('Não foi possível registrar. Tente novamente.');toast('Registro salvo.');await load()}function last7(){const arr=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);arr.push(d)}return arr}function status(s){return({pending:'Aguardando confirmação',confirmed:'Confirmado',reschedule_requested:'Remarcação solicitada',in_progress:'Em atendimento',completed:'Concluído'}[s]||s)}function statusCheck(s){return({done:'✓ realizado',pain:'⚠ senti dor',unable:'não consegui'}[s]||s)}function fmtTime(d){return new Intl.DateTimeFormat('pt-BR',{hour:'2-digit',minute:'2-digit'}).format(d)}function fmtLong(d){return new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'2-digit',month:'long'}).format(d)}function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function fail(msg){$('loading').classList.add('hidden');$('error').textContent=msg;$('error').classList.remove('hidden')}function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),2500)}})();
</script>
